name: Bug
description: Something behaves wrongly
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: dropdown
    id: money
    attributes:
      label: Touches balances, payouts or fairness?
      options: ["No", "Yes"]
